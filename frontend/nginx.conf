# Servidor del frontend de ThreatTrackApp: SPA de Angular + proxy hacia el backend.
# El navegador solo habla con este origen (puerto 8080), por lo que no hay CORS en produccion.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Comprobacion de salud del contenedor
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API REST, panel de administracion y sus estaticos -> backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
    }

    # La configuracion en tiempo de ejecucion no se cachea
    location = /assets/config.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    # Ficheros con hash: cache larga
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Rutas de la SPA
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
